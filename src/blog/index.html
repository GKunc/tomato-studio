<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <!-- @include head -->
  <title>{{BLOG_TITLE}} | {{BRAND}}</title>
  <meta name="description" content="{{BLOG_DESCRIPTION}}">
  <link rel="canonical" href="{{PAGE_URL}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{BRAND}}">
  <meta property="og:locale" content="{{LOCALE}}">
  <meta property="og:title" content="{{BLOG_TITLE}} | {{BRAND}}">
  <meta property="og:description" content="{{BLOG_DESCRIPTION}}">
  <meta property="og:url" content="{{SITE_URL}}/blog/">
  <meta property="og:image" content="{{SITE_URL}}/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{BLOG_TITLE}} | {{BRAND}}">
  <meta name="twitter:description" content="{{BLOG_DESCRIPTION}}">
  <meta name="twitter:image" content="{{SITE_URL}}/og.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Blog",
        "@id": "{{SITE_URL}}/blog/#blog",
        "name": "{{BRAND}} blog",
        "url": "{{SITE_URL}}/blog/",
        "inLanguage": "{{LANG}}",
        "publisher": { "@id": "{{SITE_URL}}/#organization" }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "{{BRAND}}", "item": "{{SITE_URL}}/" },
          { "@type": "ListItem", "position": 2, "name": "Blog", "item": "{{SITE_URL}}/blog/" }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <!-- @include header -->
  <main id="main" class="section">
    <h1>Blog</h1>
    <!-- The list is generated at build time from the @vars of each post in this folder, newest first. -->
    <ul class="post-list" id="post-list">
      <!-- @posts -->
    </ul>
  </main>
  <!-- @include footer -->
</body>
</html>
